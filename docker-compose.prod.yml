services:
  backend:
    build: .
    command: sh -c "
                python src/manage.py migrate &&
                python src/manage.py collectstatic --noinput &&
                python src/manage.py populate_test_data &&
                cd src &&
                exec gunicorn core.wsgi:application \
                  --bind 0.0.0.0:8000 \
                  --timeout 30 \
                  --workers 4"
    volumes:
      - .:/app
      - media_volume:/app/src/media
      - static_volume:/app/src/staticfiles
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started  
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - media_volume:/app/src/media
      - static_volume:/app/src/staticfiles
    ports:
      - "80:80"
    depends_on:
      - backend
  
  celery:
    build: .
    command: bash -c "cd src && celery -A core worker -l info"
    volumes:
      - .:/app
      - media_volume:/app/src/media
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started  
    restart: unless-stopped
  
  celery-beat:
    build: .
    command: bash -c "cd src && celery -A core beat -l info"
    volumes:
      - .:/app
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started  
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 3

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume: